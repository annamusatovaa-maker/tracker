<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Трекер</title>
<meta name="theme-color" content="#31261D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Трекер">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap">
<style>
:root{
  --bg:#31261D; --white:#FFFFFF; --ink:#31261D; --soft:#F5F3F0; --soft2:#ECE8E3; --line:#ECE8E3;
  --muted:#7D7368; --muted2:#A89F95; --ring:#CFC7BE;
  --accent:linear-gradient(135deg,#A87806 0%,#BE8A14 100%); --accent-solid:#B7830D;
  --accent-card:linear-gradient(180deg,#A87706 0%,#B7830D 35%,#DDB55A 100%);
  --hour:32px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
[hidden]{display:none !important}
html,body{margin:0;background:var(--bg)}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--white);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,textarea{font-family:inherit;font-size:inherit}
button{cursor:pointer}
[draggable="true"]{cursor:grab}
[draggable="true"]:active{cursor:grabbing}
.wrap{max-width:1376px;margin:0 auto;padding:calc(40px + env(safe-area-inset-top)) 32px calc(72px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:80px}
.h2{margin:0;font-size:56px;font-weight:400;letter-spacing:-.02em;line-height:1;color:var(--white)}
.h2.big{font-size:56px}
.sec{display:flex;flex-direction:column;gap:22px;min-width:0}
.sec-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;min-height:42px}
.sec-head .l{display:flex;flex-wrap:wrap;align-items:center;gap:16px 20px}
.board{border-radius:18px;background:var(--white);color:var(--ink)}
.sub{font-size:13px;color:var(--white)}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;flex:none;width:40px;height:40px;border:0;border-radius:999px;background:var(--white);color:var(--ink);transition:background .15s}
.icon-btn:hover{background:var(--soft2)}
.icon-btn.sm{width:32px;height:32px}
.icon-btn.flat{background:transparent}
.icon-btn.flat:hover{background:var(--soft)}
.pill{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border:0;border-radius:999px;background:var(--white);color:var(--ink);font-size:14px;white-space:nowrap;transition:background .15s}
.pill:hover{background:var(--soft2)}
.pill.sm{height:32px;padding:0 12px;font-size:13px}
.pill.soft{background:var(--soft)}
.pill.on{background:var(--accent);color:#fff}
.dark{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 22px;border:0;border-radius:999px;background:var(--ink);color:#fff;font-size:15px;font-weight:500;white-space:nowrap;transition:background .15s}
.dark:hover{background:#4A3B2F}
.segs{display:inline-flex;flex-wrap:wrap;gap:2px;padding:3px;border-radius:999px;background:rgba(255,255,255,.12)}
.seg{height:32px;padding:0 14px;border:0;border-radius:999px;background:transparent;color:#fff;font-size:13px;font-weight:500}
.seg.on{background:#fff;color:var(--ink)}
.row{display:flex;align-items:center;gap:12px;width:100%;min-width:0;min-height:44px;padding:6px 12px;border:0;border-radius:12px;background:var(--soft);color:var(--ink);font-size:14px;text-align:left;transition:background .15s}
.row:hover{background:#EFEBE6}
.row.plain{background:#fff}
.row.plain:hover{background:var(--soft)}
.mark{flex:none;width:20px;height:20px;border-radius:999px;border:1.6px solid var(--ring);background:transparent;display:inline-flex;align-items:center;justify-content:center;color:#fff;padding:0}
.mark.on{border:0;background:var(--accent)}
.mark.dark-on{border:0;background:var(--ink)}
.mark.grey-on{border:0;background:var(--muted2)}
.strike{color:var(--muted2);text-decoration:line-through}
.chip{display:inline-flex;align-items:center;height:36px;padding:0 16px;border:0;border-radius:999px;background:var(--soft);color:var(--muted);font-size:14px;transition:background .15s,color .15s}
.chip:hover{color:var(--ink);background:var(--soft2)}
.chip.on{background:var(--ink);color:#fff}
.chip.on.imp{background:var(--accent)}
.qchip{display:inline-flex;align-items:center;height:32px;padding:0 12px;border:0;border-radius:10px;background:var(--soft);color:#5C534A;font-size:13px}
.qchip:hover{background:var(--soft2);color:var(--ink)}
.qchip.on{background:var(--ink);color:#fff}
.field{width:100%;border:0;border-radius:12px;background:var(--soft);padding:14px 16px;font-size:15px;color:var(--ink);outline:none}
.field:focus{box-shadow:0 0 0 2px var(--ink) inset}
.field::placeholder{color:var(--muted2)}
.link{border:0;background:transparent;padding:0;color:var(--muted);font-size:14px;text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--ink)}
.empty{padding:14px 12px;font-size:13px;color:var(--muted2)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:none;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink)}

.sdot{position:absolute;top:2px;right:2px;width:10px;height:10px;border-radius:999px;border:2px solid var(--bg);background:var(--accent-solid)}
.sdot.busy{background:#fff;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.sync-ok{font-size:13px;color:var(--muted);line-height:1.5}
@media (min-width:761px){ .prog-btn{width:40px;height:40px;padding:0;justify-content:center} .prog-txt{display:none} }
/* быстрый ввод, серии, итоги */
.parse{margin-top:-12px;padding:10px 14px;border-radius:12px;background:#FBF4E4;color:var(--ink);font-size:13px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.parse b{font-weight:600}
.streak{color:var(--accent-solid);font-weight:500}
.steps-n{color:var(--ink);font-weight:500}
.wk-top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 18px;border-radius:16px;background:var(--soft)}
.wk-big b{display:block;font-size:44px;font-weight:400;line-height:1}
.wk-big span{font-size:14px;color:var(--muted)}
.wk-ring{flex:none;width:84px;height:84px;border-radius:999px;display:flex;align-items:center;justify-content:center;position:relative}
.wk-ring::before{content:"";position:absolute;inset:9px;border-radius:999px;background:var(--soft)}
.wk-ring span{position:relative;font-size:18px;font-weight:600}
.wk-row{display:flex;align-items:center;gap:10px;font-size:14px}
.wk-row .nm{width:96px;flex:none}
.wk-bar{flex:1;height:8px;border-radius:999px;background:var(--soft);overflow:hidden}
.wk-bar i{display:block;height:100%;border-radius:999px;background:var(--ink)}
.wk-row .num,.wk-hab .num{font-size:13px;color:var(--muted);white-space:nowrap}
.wk-hab{display:flex;flex-direction:column;gap:6px}
.wk-hab .h{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.wk-hab .pr-cells i{height:16px}
.wk-hab .pr-cells i.on{background:var(--ink)}
.wk-hab .pr-cells i.miss{background:#E3DED8}
/* шапка календаря */
.plan-head{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;min-height:32px}
.pnav{display:flex;align-items:center;gap:4px}
.pact{display:flex;align-items:center;gap:10px;margin-left:auto}
#period{min-width:130px}

/* мобильная лента дней и список дел */
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;padding:4px}
.sday{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 7px;border:0;border-radius:12px;background:transparent;color:var(--ink)}
.sday .w{font-size:11px;color:var(--muted)}
.sday .n{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border-radius:999px;font-size:17px;font-weight:400}
.sday.past .n{color:#BDB5AC}
.sday.today .n{background:var(--soft2)}
.sday.sel .n{background:var(--ink);color:#fff}
.sday.sel.today .n{background:var(--accent)}
.sday .dots{display:flex;gap:3px;height:5px}
.sday .dots i{width:5px;height:5px;border-radius:999px;background:var(--ring)}
.sday .dots i.imp{background:var(--accent-solid)}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;padding:4px}
.mgrid .wd{text-align:center;font-size:11px;color:var(--muted);padding:4px 0}
.agenda{border-top:1px solid var(--line);margin-top:4px;padding:12px 6px 6px;display:flex;flex-direction:column;gap:6px}
.agenda-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 6px 4px}
.agenda-h b{font-size:15px;font-weight:600}
.arow{display:flex;align-items:center;gap:10px;min-height:48px;padding:6px 10px;border-radius:12px;background:var(--soft)}
.arow.imp{background:var(--accent);color:#fff}
.arow .tick{flex:none;width:22px;height:22px;border-radius:999px;border:1.6px solid var(--ring);background:transparent;padding:0;display:inline-flex;align-items:center;justify-content:center;color:#fff}
.arow.imp .tick{border-color:rgba(255,255,255,.85)}
.arow .tick.on{border:0;background:var(--muted2)}
.arow.imp .tick.on{background:#fff;color:var(--accent-solid)}
.arow .tm{flex:none;width:46px;font-size:13px;opacity:.75;display:flex;flex-direction:column;line-height:1.2}
.arow .tm small{font-size:11px;opacity:.75}
.arow .ttl{flex:1;min-width:0;display:flex;align-items:center;gap:6px;border:0;background:transparent;color:inherit;padding:4px 0;text-align:left;font-size:15px}
.arow .ttl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arow.done{opacity:.5}
.arow.done .ttl span{text-decoration:line-through}

/* календарь */
.cal-scroll{overflow:auto;max-height:420px;border-radius:12px;-webkit-overflow-scrolling:touch}
.cal{min-width:840px}
.cal-head{position:sticky;top:0;z-index:3;display:grid;grid-template-columns:48px repeat(7,minmax(0,1fr));background:#fff;border-bottom:1px solid var(--line)}
.cal-head .d{display:flex;align-items:baseline;justify-content:space-between;padding:8px 10px 10px}
.cal-head .wd{font-size:12px;color:var(--muted)}
.cal-head .num{font-size:20px;font-weight:300}
.cal-head .num.past{color:#BDB5AC}
.cal-head .num.today{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:999px;background:var(--accent);color:#fff;font-size:14px;font-weight:600}
.cal-body{display:grid;grid-template-columns:48px repeat(7,minmax(0,1fr))}
.hours{position:relative;height:calc(var(--hour)*17)}
.hours span{position:absolute;right:8px;font-size:11px;color:var(--muted2)}
.daycol{position:relative;height:calc(var(--hour)*17);border-left:1px solid var(--line);background-image:repeating-linear-gradient(to bottom,transparent 0 31px,#F1EEEA 31px 32px)}
.daycol.drop{background-color:var(--soft)}
.now{position:absolute;left:0;right:0;height:2px;background:var(--accent-solid);z-index:2;pointer-events:none}
.now::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:999px;background:var(--accent-solid)}
.ev{position:absolute;left:3px;right:3px;height:26px;padding:0 7px;border:0;border-radius:7px;display:flex;align-items:center;gap:5px;font-size:12px;white-space:nowrap;overflow:hidden;text-align:left;background:var(--soft);color:var(--ink);z-index:1}
.ev:hover{filter:brightness(.96)}
.ev.imp{background:var(--accent);color:#fff;font-weight:500}
.ev.dim{opacity:.45}
.ev.tall{flex-direction:column;align-items:stretch;justify-content:flex-start;gap:2px;padding:4px 7px}
.ev.tall .evt{font-size:11px}
.ev.tall .evr{display:flex;align-items:center;gap:5px;min-width:0}
.ev .t{opacity:.65}
.ev .x{overflow:hidden;text-overflow:ellipsis}
.ev.done .x{text-decoration:line-through}
.month{min-width:700px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.month .wd{padding:6px 10px 2px;font-size:12px;color:var(--muted)}
.mcell{min-height:96px;padding:8px;border-radius:10px;background:var(--soft);display:flex;flex-direction:column;gap:3px}
.mcell.blank{background:transparent}
.mcell.drop{background:var(--soft2)}
.mcell .n{font-size:15px;font-weight:300;margin-bottom:3px}
.mcell .n.past{color:#BDB5AC}
.mcell .n.today{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:999px;background:var(--accent);color:#fff;font-size:13px;font-weight:600}
.mit{border:0;text-align:left;padding:3px 6px;border-radius:6px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#fff;color:var(--ink)}
.mit.imp{background:var(--accent);color:#fff}
.mit.dim{opacity:.45}
.mit.done{text-decoration:line-through}
.mit.more{background:transparent;color:var(--muted)}

/* сегодня */
.row-today,.row3{display:flex;gap:24px;align-items:stretch}
.grow{flex:1 1 auto;min-width:0}
.side{flex:0 0 384px;min-width:0}
.progress{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;font-size:14px;color:#fff}
.bar{width:140px;height:6px;border-radius:999px;background:rgba(255,255,255,.2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:#fff;transition:width .3s}
.cards{flex:1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.card{display:flex;flex-direction:column;gap:2px;padding:12px 8px 10px;border-radius:16px;min-height:250px;background:#fff;color:var(--ink);min-width:0}
.card.imp{background:var(--accent-card);color:#fff}
.card.drop{outline:2px dashed #fff;outline-offset:3px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 4px 6px}
.card-h .nm{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;min-width:0}
.card-h .nm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-h .cnt{font-size:12px;opacity:.6}
.add{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 10px;border:0;border-radius:10px;background:transparent;color:inherit;font-size:14px;opacity:.65;transition:background .15s,opacity .15s;text-align:left}
.add:hover{opacity:1;background:var(--soft)}
.card.imp .add:hover{background:rgba(255,255,255,.14)}
.task{display:flex;align-items:flex-start;gap:10px;padding:6px 6px 6px 10px;border-radius:10px;transition:background .15s}
.task:hover{background:var(--soft)}
.card.imp .task:hover{background:rgba(255,255,255,.14)}
.task .tick{flex:none;width:18px;height:18px;margin-top:2px;border-radius:999px;border:1.6px solid var(--ring);background:transparent;padding:0;display:inline-flex;align-items:center;justify-content:center;color:#fff}
.card.imp .task .tick{border-color:rgba(255,255,255,.85)}
.task .tick.on{border:0;background:var(--muted2)}
.card.imp .task .tick.on{background:#fff;color:var(--accent-solid)}
.task .ttl{flex:1;min-width:0;border:0;background:transparent;padding:1px 0;text-align:left;color:inherit;font-size:14px;line-height:1.35}
.task .ti{display:inline-flex;vertical-align:-2px;margin-right:6px;opacity:.85}
.task .meta{display:block;font-size:11px;opacity:.6;margin-top:2px}
.task.done{opacity:.5}
.done-sep{margin:14px 10px 2px;padding-top:10px;border-top:1px solid currentColor;font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.4}
.list{display:flex;flex-direction:column;gap:6px;padding:8px}
.habit-meta{font-size:11px;color:#BDB5AC;white-space:nowrap}

/* заряд */
.batt{flex:0 0 64px;display:flex;flex-direction:column;gap:14px}
.batt .pct{min-height:56px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;color:#fff}
.cells{flex:1;min-height:220px;display:flex;flex-direction:column-reverse;gap:4px;padding:6px}
.cells i{flex:1;border-radius:6px;background:var(--soft)}
.cells i.on{background:var(--accent)}
.batt .lbl{text-align:center;font-size:11px;color:#fff;text-transform:uppercase;letter-spacing:.08em}

/* инсайты */
.ins-box{display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:20px}
.ins-area{position:relative}
.ins-area textarea{background:#fff;min-height:180px;resize:vertical;padding:18px 64px 18px 20px;font-size:16px;line-height:1.5}
.ins-area .mic{position:absolute;top:12px;right:12px;width:44px;height:44px;background:var(--soft)}
.ins-area .mic.on{background:var(--accent);color:#fff}
.ins-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.ins-save{margin-left:auto}
.ins-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.ins-card{display:flex;flex-direction:column;gap:10px;padding:16px}
.ins-card .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tag{align-self:flex-start;padding:3px 10px;border-radius:999px;font-size:11px;background:var(--soft);color:#5C534A}
.ins-card .txt{font-size:15px;line-height:1.5;white-space:pre-line;overflow-wrap:anywhere}
.ins-empty{padding:28px;border-radius:16px;border:1px dashed rgba(255,255,255,.35);text-align:center;font-size:14px;color:#fff}

/* окна */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(20,14,10,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.dialog{width:100%;max-width:620px;max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow-y:auto;padding:28px 28px 24px;border-radius:24px;background:#fff;color:var(--ink);box-shadow:0 24px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:22px}
.dialog > *{flex-shrink:0;min-width:0}
.dialog form .field{min-width:0}
.dialog{overflow-x:hidden}
.dialog.wide{max-width:760px}
.dlg-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
.dlg-h h3{margin:0;font-size:26px;font-weight:400}
.lbl{font-size:13px;color:var(--muted2)}
.col{display:flex;flex-direction:column;gap:10px}
.wrapr{display:flex;flex-wrap:wrap;gap:6px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.two label{display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--muted2)}
.step{display:flex;align-items:center;gap:10px}
.step .field{padding:10px 12px;font-size:14px}
.dlg-f{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-top:4px}
.dlg-f .r{display:flex;gap:8px;flex-wrap:wrap}
.pr-row{display:flex;flex-direction:column;gap:6px}
.pr-row .h{display:flex;justify-content:space-between;font-size:14px}
.pr-cells{display:flex;gap:3px}
.pr-cells i{flex:1;height:20px;border-radius:4px;background:var(--soft)}
.pr-cells i.on{background:var(--accent)}
.pr-cells i.miss{background:#E3DED8}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;padding:12px 18px;border-radius:999px;background:#fff;color:var(--ink);font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25)}

/* адаптив */
@media (max-width:1100px){
  .row-today,.row3{flex-wrap:wrap}
  .side{flex:1 1 100%}
  .cards{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:760px){
  body{overflow-x:hidden}
  .pill-txt{display:none}
  .pact .pill{width:40px;padding:0;justify-content:center}
  .ins-row{flex-direction:column;align-items:stretch;gap:10px}
  #ins-cats{flex-wrap:nowrap}
  #ins-cats .chip{padding:0 14px;white-space:nowrap}
  .ins-save{margin-left:0;width:100%}
  .plan-head{display:grid;grid-template-columns:1fr auto;grid-template-areas:"t a" "n s";gap:14px 8px}
  .plan-head .h2{grid-area:t}
  .pact{grid-area:a;margin:0;gap:8px;justify-self:end}
  .pnav{grid-area:n}

/* ---------- логика задач ---------- */
function occurs(task, ds){
  var r=task.repeat||{type:'none'};
  if(!task.date) return false;
  if(r.type==='none') return task.date===ds;
  if(ds<task.date) return false;
  var w=wdIdx(parse(ds));
  if(r.type==='day') return true;
  if(r.type==='week') return w===wdIdx(parse(task.date));
  if(r.type==='days') return (r.days||[]).indexOf(w)>=0;
  return false;
}
function isDone(task, ds){ return !!(task.doneOn&&task.doneOn[ds]); }
function setDone(task, ds, v){ task.doneOn=task.doneOn||{}; if(v) task.doneOn[ds]=true; else delete task.doneOn[ds]; }
function tasksOn(ds){
  return D.tasks.filter(function(x){ return occurs(x,ds); })
    .sort(function(a,b){ return (a.time||'99')<(b.time||'99')?-1:(a.time||'99')>(b.time||'99')?1:0; });
}
function findTask(id){ for(var i=0;i<D.tasks.length;i++) if(D.tasks[i].id===id) return D.tasks[i]; return null; }
function repeatLabel(r){
  if(!r||r.type==='none') return '';
  if(r.type==='day') return 'каждый день';
  if(r.type==='week') return 'каждую неделю';
  return (r.days||[]).sort().map(function(i){return WD[i].toLowerCase();}).join(', ');
}

var MQ = window.matchMedia('(max-width:760px)');
function weekLabel(s){
  var e=addDays(s,6);
  return s.getMonth()===e.getMonth()
    ? s.getDate()+' – '+e.getDate()+' '+MON_GEN[e.getMonth()]
    : s.getDate()+' '+MON_GEN[s.getMonth()].slice(0,3)+' – '+e.getDate()+' '+MON_GEN[e.getMonth()].slice(0,3);
}
function dots(ds){
  var l=tasksOn(ds); if(!l.length) return '<span class="dots"></span>';
  var h='<span class="dots">'; l.slice(0,3).forEach(function(x){ h+='<i class="'+(x.cat==='imp'?'imp':'')+'"></i>'; }); return h+'</span>';
}
// телефон: лента дней (или сетка месяца) + список дел выбранного дня
function renderCalendarMobile(){
  var td=todayStr(), a=UI.anchor, html='';
  if(!UI.sel) UI.sel=td;
  if(UI.view==='week'){
    var s=startOfWeek(a);
    var sd=parse(UI.sel); if(sd<s||sd>addDays(s,6)) UI.sel = (td>=ymd(s)&&td<=ymd(addDays(s,6))) ? td : ymd(s);
    $('period').textContent=weekLabel(s);
    html+='<div class="strip">';
    for(var i=0;i<7;i++){
      var d=addDays(s,i), ds=ymd(d);
      html+='<button class="sday'+(ds===td?' today':'')+(ds<td?' past':'')+(ds===UI.sel?' sel':'')+'" data-a="sel" data-d="'+ds+'" aria-pressed="'+(ds===UI.sel)+'"><span class="w">'+WD[i]+'</span><span class="n">'+d.getDate()+'</span>'+dots(ds)+'</button>';
    }
    html+='</div>';
  } else {
    var m0=new Date(a.getFullYear(),a.getMonth(),1), lead=wdIdx(m0), dim=new Date(a.getFullYear(),a.getMonth()+1,0).getDate();
    var selD=parse(UI.sel); if(selD.getMonth()!==a.getMonth()||selD.getFullYear()!==a.getFullYear()) UI.sel = (new Date().getMonth()===a.getMonth()&&new Date().getFullYear()===a.getFullYear()) ? td : ymd(m0);
    $('period').textContent=MON_NOM[a.getMonth()]+' '+a.getFullYear();
    html+='<div class="mgrid">'; WD.forEach(function(w){ html+='<div class="wd">'+w+'</div>'; });
    for(var b=0;b<lead;b++) html+='<div></div>';
    for(var n=1;n<=dim;n++){
      var cds=ymd(new Date(a.getFullYear(),a.getMonth(),n));
      html+='<button class="sday'+(cds===td?' today':'')+(cds<td?' past':'')+(cds===UI.sel?' sel':'')+'" style="padding:4px 0 6px" data-a="sel" data-d="'+cds+'" aria-pressed="'+(cds===UI.sel)+'"><span class="n">'+n+'</span>'+dots(cds)+'</button>';
    }
    html+='</div>';
  }
  // список дел выбранного дня
  var sdd=parse(UI.sel), list=tasksOn(UI.sel);
  var title = UI.sel===td ? 'Сегодня, '+sdd.getDate()+' '+MON_GEN[sdd.getMonth()] : WD_FULL[wdIdx(sdd)][0].toUpperCase()+WD_FULL[wdIdx(sdd)].slice(1)+', '+sdd.getDate()+' '+MON_GEN[sdd.getMonth()];
  html+='<div class="agenda"><div class="agenda-h"><b>'+title+'</b><button class="pill sm soft" data-a="new" data-date="'+UI.sel+'">+ Дело</button></div>';
  if(!list.length) html+='<div class="empty" style="padding:6px 6px 10px">На этот день ничего не запланировано</div>';
  list.forEach(function(x){
    var dn=isDone(x,UI.sel);
    html+='<div class="arow'+(x.cat==='imp'?' imp':'')+(dn?' done':'')+'">'
      +'<button class="tick'+(dn?' on':'')+'" data-a="tick" data-id="'+x.id+'" data-d="'+UI.sel+'" aria-pressed="'+dn+'" aria-label="Отметить выполненным">'+(dn?CHECK:'')+'</button>'
      +'<span class="tm">'+(x.time||'—')+(x.time?'<small>'+durLabel(x.dur)+'</small>':'')+'</span>'
      +'<button class="ttl" data-a="open" data-id="'+x.id+'" data-d="'+UI.sel+'">'+tIcon(x,15,2)+'<span>'+t(x.title)+'</span></button></div>';
  });
  html+='</div>';
  $('calendar').innerHTML=html;
}

function renderCalendar(){
  document.querySelectorAll('[data-a="view"]').forEach(function(b){ b.classList.toggle('on', b.dataset.v===UI.view); b.setAttribute('aria-pressed', b.dataset.v===UI.view); });
  $('plan-h').textContent = UI.view==='week'?'Неделя':'Месяц';
  if(MQ.matches){ renderCalendarMobile(); return; }
  var td=todayStr(), a=UI.anchor, html='';
  if(UI.view==='week'){
    var s=startOfWeek(a), e=addDays(s,6);
    $('period').textContent = s.getMonth()===e.getMonth()
      ? s.getDate()+' – '+e.getDate()+' '+MON_GEN[e.getMonth()]
      : s.getDate()+' '+MON_GEN[s.getMonth()]+' – '+e.getDate()+' '+MON_GEN[e.getMonth()];
    html+='<div class="cal-scroll" id="cal-scroll"><div class="cal"><div class="cal-head"><div></div>';
    for(var i=0;i<7;i++){
      var d=addDays(s,i), ds=ymd(d);
      var cls = ds===td?'today':(ds<td?'past':'');
      html+='<div class="d"><span class="wd">'+WD[i]+'</span><span class="num '+cls+'">'+d.getDate()+'</span></div>';
    }
    html+='</div><div class="cal-body"><div class="hours">';
    for(var h=H0;h<=H1;h++) html+='<span style="top:'+Math.max((h-H0)*HOUR-6,2)+'px">'+h+':00</span>';
    html+='</div>';
    for(var j=0;j<7;j++){
      var dd=addDays(s,j), dds=ymd(dd);
      html+='<div class="daycol" data-drop="day:'+dds+'">';
      if(dds===td){ var nh=new Date().getHours()+new Date().getMinutes()/60; if(nh>=H0&&nh<=H1+1) html+='<div class="now" style="top:'+Math.round((nh-H0)*HOUR)+'px"></div>'; }
      // раскладываем пересекающиеся дела по колонкам
      var evs=tasksOn(dds).filter(function(x){ return x.time; }).map(function(x){ var st=Math.min(Math.max(hm(x.time),H0),H1+0.2); return {x:x,st:st,en:st+Math.max((x.dur||60)/60,0.5)}; });
      evs.sort(function(a,b){ return a.st-b.st; });
      var cluster=[], clEnd=-1, lanesEnd=[];
      function flush(){ var n=lanesEnd.length||1; cluster.forEach(function(o){ o.n=n; }); cluster=[]; lanesEnd=[]; }
      evs.forEach(function(o){
        if(o.st>=clEnd-1e-6) flush();
        var lane=-1; for(var q=0;q<lanesEnd.length;q++){ if(lanesEnd[q]<=o.st+1e-6){ lane=q; break; } }
        if(lane<0){ lane=lanesEnd.length; lanesEnd.push(0); }
        lanesEnd[lane]=o.en; o.lane=lane; cluster.push(o); clEnd=Math.max(clEnd,o.en);
      });
      flush();
      evs.forEach(function(o){
        var x=o.x, dn=isDone(x,dds), hgt=Math.max(Math.round((o.en-o.st)*HOUR)-4,24), w=100/o.n;
        var tall=hgt>=44;
        html+='<button class="ev'+(x.cat==='imp'?' imp':'')+(dn?' dim done':'')+(tall?' tall':'')+'" draggable="true" data-drag="task:'+x.id+':'+dds+'" data-a="open" data-id="'+x.id+'" data-d="'+dds+'" style="top:'+Math.round((o.st-H0)*HOUR+2)+'px;height:'+hgt+'px;left:calc('+(w*o.lane)+'% + 3px);right:auto;width:calc('+w+'% - 6px)" title="'+esc(x.time+'–'+endTime(x)+' '+x.title)+'">'
          +(tall?'<span class="evt"><span class="t">'+x.time+'–'+endTime(x)+'</span></span><span class="evr">'+tIcon(x,11,2.2)+'<span class="x">'+esc(x.title)+'</span></span>'
                :'<span class="t">'+x.time+'</span>'+tIcon(x,11,2.2)+'<span class="x">'+esc(x.title)+'</span>')+'</button>';
      });
      html+='</div>';
    }
    html+='</div></div></div>';
    $('calendar').innerHTML=html;
    var sc=$('cal-scroll');
    if(sc && !UI.scrolled){
      var nowH=new Date().getHours(); sc.scrollTop=Math.max(0,(Math.min(Math.max(nowH,H0),H1)-H0-1)*HOUR);
      // на узком экране сразу показываем сегодняшний день
      var ti=wdIdx(new Date()); if(sc.scrollWidth>sc.clientWidth && ymd(s)<=td && td<=ymd(e)){ var colW=(sc.scrollWidth-48)/7; sc.scrollLeft=Math.max(0,colW*ti-colW*0.5); }
      UI.scrolled=true;
    }
  } else {
    var m0=new Date(a.getFullYear(),a.getMonth(),1), lead=wdIdx(m0), dim=new Date(a.getFullYear(),a.getMonth()+1,0).getDate();
    $('period').textContent = MON_NOM[a.getMonth()]+' '+a.getFullYear();
    html+='<div style="overflow-x:auto"><div class="month">';
    WD.forEach(function(w){ html+='<div class="wd">'+w+'</div>'; });
    for(var b=0;b<lead;b++) html+='<div class="mcell blank"></div>';
    for(var n=1;n<=dim;n++){
      var cd=new Date(a.getFullYear(),a.getMonth(),n), cds=ymd(cd);
      var list=tasksOn(cds), ncls=cds===td?'today':(cds<td?'past':'');
      html+='<div class="mcell" data-drop="mday:'+cds+'"><div><span class="n '+ncls+'">'+n+'</span></div>';
      list.slice(0,3).forEach(function(x){
        var dn=isDone(x,cds);
        html+='<button class="mit'+(x.cat==='imp'?' imp':'')+(dn?' dim':'')+(dn?' done':'')+'" draggable="true" data-drag="task:'+x.id+':'+cds+'" data-a="open" data-id="'+x.id+'" data-d="'+cds+'" style="display:flex;align-items:center;gap:4px">'+(x.time?'<span style="opacity:.7">'+x.time+'</span>':'')+tIcon(x,10,2.2)+'<span style="overflow:hidden;text-overflow:ellipsis">'+esc(x.title)+'</span></button>';
      });
      if(list.length>3) html+='<button class="mit more" data-a="goweek" data-d="'+cds+'">+ ещё '+(list.length-3)+'</button>';
      html+='</div>';
    }
    var tail=(7-((lead+dim)%7))%7; for(var z=0;z<tail;z++) html+='<div class="mcell blank"></div>';
    html+='</div></div>';
    $('calendar').innerHTML=html;
  }
}

function renderToday(){
  var td=todayStr(), now=new Date();
  $('today-date').textContent = WD_FULL[wdIdx(now)]+', '+now.getDate()+' '+MON_GEN[now.getMonth()];
  var list=tasksOn(td), done=list.filter(function(x){return isDone(x,td);}).length, pct=list.length?Math.round(done/list.length*100):0;
  $('today-progress').innerHTML='<span>Сделано <b style="font-weight:600">'+done+'</b> из '+list.length+'</span><div class="bar" role="progressbar" aria-label="Выполнено задач на сегодня" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pct+'"><i style="width:'+pct+'%"></i></div>'
    +(movableToday().length?'<button class="pill sm" data-a="move-tomorrow" title="Перенести несделанные задачи на завтра"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>Перенести на\u00A0завтра</button>':'')
    +([0,5,6].indexOf(wdIdx(now))>=0?'<button class="pill sm" data-a="week" data-d="'+(wdIdx(now)===0?ymd(addDays(now,-7)):td)+'">Итоги недели</button>':'');
  var html='';
  CATS.forEach(function(c){
    var items=list.filter(function(x){return x.cat===c.id;});
    var open=items.filter(function(x){return !isDone(x,td);}), dn=items.filter(function(x){return isDone(x,td);});
    html+='<div class="card'+(c.id==='imp'?' imp':'')+'" data-drop="cat:'+c.id+'">'
      +'<div class="card-h"><div class="nm">'+icon(c.id,15,1.9)+'<span>'+c.name+'</span></div><span class="cnt">'+dn.length+'/'+items.length+'</span></div>'
      +'<button class="add" data-a="new" data-cat="'+c.id+'">'+PLUS_C+'Добавить</button>';
    open.forEach(function(x){ html+=taskRow(x,td,false); });
    if(dn.length){ html+='<div class="done-sep">Сделано</div>'; dn.forEach(function(x){ html+=taskRow(x,td,true); }); }
    html+='</div>';
  });
  $('cards').innerHTML=html;
}
function taskRow(x,ds,done){
  var meta=[]; if(x.time) meta.push(x.time+'–'+endTime(x));
  var rl=repeatLabel(x.repeat); if(rl) meta.push(rl);
  if(x.steps&&x.steps.length){ var sd=x.steps.filter(function(s){return s.done;}).length; meta.push('шаги '+sd+'/'+x.steps.length); }
  return '<div class="task'+(done?' done':'')+'" draggable="true" data-drag="task:'+x.id+':'+ds+'">'
    +'<button class="tick'+(done?' on':'')+'" data-a="tick" data-id="'+x.id+'" data-d="'+ds+'" aria-pressed="'+done+'" aria-label="Отметить выполненной">'+(done?CHECK:'')+'</button>'
    +'<button class="ttl" data-a="open" data-id="'+x.id+'" data-d="'+ds+'">'+((x.icon||presetIcon(x.title))?'<span class="ti">'+icon(x.icon||presetIcon(x.title),13,2)+'</span>':'')+t(x.title)+(meta.length?'<span class="meta">'+esc(meta.join(' · '))+'</span>':'')+'</button></div>';
}

function habitMeta(h){
  var td=todayStr();
  if(isStepsHabit(h) && D.steps && D.steps[td]!=null) return '<span class="steps-n">'+fmtNum(D.steps[td])+'</span> / '+fmtNum(stepsTarget(h));
  var st=habitStreak(h.id);
  if(st>=2) return '<span class="streak">'+st+'\u00A0'+plural(st,'день','дня','дней')+' подряд</span>';
  return t(h.meta||'');
}
function renderHabits(){
  var td=todayStr(), log=D.habitLog[td]||{}, html='';
  D.habits.forEach(function(h){
    var on=!!log[h.id];
    html+='<button class="row" data-a="habit" data-id="'+h.id+'" aria-pressed="'+on+'"><span class="mark'+(on?' on':'')+'">'+(on?CHECK:'')+'</span>'
      +'<span style="flex:1;min-width:0" class="'+(on?'strike':'')+'">'+t(h.title)+'</span><span class="habit-meta">'+habitMeta(h)+'</span></button>';
  });
  if(!D.habits.length) html='<div class="empty">Добавьте привычки в настройках</div>';
  $('habits').innerHTML=html;
}

function renderWishes(){
  ['small','big'].forEach(function(k){
    var html='<div style="padding:6px 8px 4px;font-size:13px;color:var(--muted)">'+(k==='small'?'Маленькие радости':'Большие мечты')+'</div>';
    var list=D.wishes.filter(function(w){return w.kind===k;});
    list.forEach(function(w){
      html+='<div class="row plain" style="min-height:40px;padding-right:4px"><button class="mark'+(w.done?' dark-on':'')+'" data-a="wish" data-id="'+w.id+'" aria-pressed="'+!!w.done+'" aria-label="Отметить исполненным">'+(w.done?CHECK:'')+'</button>'
        +'<span style="flex:1;min-width:0;overflow-wrap:anywhere" class="'+(w.done?'strike':'')+'">'+t(w.text)+'</span>'
        +'<button class="icon-btn sm flat" data-a="wish-del" data-id="'+w.id+'" aria-label="Удалить" style="opacity:.5">'+CLOSE+'</button></div>';
    });
    if(!list.length) html+='<div class="empty" style="padding-top:4px">Пока пусто</div>';
    $(k==='small'?'wish-small':'wish-big').innerHTML=html;
  });
}

function renderBattery(){
  var td=todayStr(), list=tasksOn(td), log=D.habitLog[td]||{};
  var done=list.filter(function(x){return isDone(x,td);}).length
    + D.habits.filter(function(h){return log[h.id];}).length
    + D.wishes.filter(function(w){return w.kind==='small'&&w.done&&w.doneDate===td;}).length;
  var total=list.length+D.habits.length;
  var pct=total?Math.min(100,Math.round(done/total*100)):0, filled=Math.round(pct/10), html='';
  var A=[0xA8,0x77,0x06], Z=[0xE0,0xBA,0x63];
  for(var i=0;i<10;i++){ var k=i/9, c='rgb('+A.map(function(v,j){ return Math.round(v+(Z[j]-v)*k); }).join(',')+')'; html+='<i'+(i<filled?' style="background:'+c+'"':'')+'></i>'; }
  $('batt-cells').innerHTML=html; $('batt-cells').setAttribute('aria-valuenow',pct);
  $('batt-pct').textContent=pct+'%';
}

// окно задачи: новая или редактирование
function openTask(opts){
  opts=opts||{};
  var x = opts.id ? findTask(opts.id) : null;
  var f = x ? JSON.parse(JSON.stringify(x)) : {
    id:null, title:opts.title||'', cat:opts.cat||'imp', date:opts.date||todayStr(), time:opts.time||'', dur:60, desc:'', steps:[], repeat:{type:'none',days:[]}
  };
  f.repeat=f.repeat||{type:'none',days:[]};
  UI.modal={kind:'task', f:f, occ:opts.d||f.date, inboxId:opts.inboxId||null};
  drawTask();
}
function drawTask(){
  var M=UI.modal, f=M.f, editing=!!f.id, x=editing?findTask(f.id):null, dn=x?isDone(x,M.occ):false;
  var h='<div class="dlg-h"><h3>'+(editing?'Задача':'Новая задача')+'</h3><button class="icon-btn flat" data-a="close" aria-label="Закрыть">'+CLOSE+'</button></div>'

/* ---------- склонения ---------- */
function plural(n,a,b,c){ n=Math.abs(n)%100; var n1=n%10; if(n>10&&n<20) return c; if(n1>1&&n1<5) return b; if(n1===1) return a; return c; }
function fmtNum(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' '); }

/* ---------- серии привычек ---------- */
function habitStreak(hid){
  var d=new Date(), n=0, log=D.habitLog||{};
  if(!(log[ymd(d)]&&log[ymd(d)][hid])) d=addDays(d,-1); // сегодня ещё не отмечено — считаем до вчера
  while(log[ymd(d)]&&log[ymd(d)][hid]){ n++; d=addDays(d,-1); if(n>999) break; }
  return n;
}

/* ---------- шаги (из «Команд» iPhone через синхронизацию) ---------- */
function isStepsHabit(h){ return /шаг/i.test(h.title||''); }
function stepsTarget(h){ var m=String(h.title||'').replace(/\s| /g,'').match(/\d+/); return m?+m[0]:10000; }
function applySteps(ds,n){
  if(!ds||!(n>=0)) return false;
  D.steps=D.steps||{}; var changed=D.steps[ds]!==n; D.steps[ds]=n;
  D.habits.forEach(function(h){
    if(isStepsHabit(h) && n>=stepsTarget(h)){
      D.habitLog[ds]=D.habitLog[ds]||{};
      if(!D.habitLog[ds][h.id]){ D.habitLog[ds][h.id]=true; changed=true; }
    }
  });
  return changed;
}

/* ---------- быстрый ввод: «завтра 15:00 зал 1,5 ч» ---------- */
var WD_RE=[['пн','понедельник'],['вт','вторник'],['ср','сред[ау]'],['чт','четверг'],['пт','пятниц[ау]'],['сб','суббот[ау]'],['вс','воскресенье']];
function parseQuick(text){
  var s=' '+String(text||'')+' ', r={}, B='(^|\\s)', E='(?=\\s|$|[,.!?])';
  function cut(re,fn){ var m=s.match(re); if(m){ if(fn(m)!==false) s=s.replace(m[0],' '); } }
  // длительность
  cut(new RegExp(B+'полтора\\s+час[а]?'+E,'i'),function(){ r.dur=90; });
  cut(new RegExp(B+'полчаса'+E,'i'),function(){ r.dur=30; });
  cut(new RegExp(B+'(\\d+(?:[.,]\\d+)?)\\s*(ч|час|часа|часов)'+E,'i'),function(m){
    var before=s.slice(0,s.indexOf(m[0])+m[1].length); if(/(^|\s)в\s*$/i.test(before)) return false;
    r.dur=Math.round(parseFloat(m[2].replace(',','.'))*60); });
  cut(new RegExp(B+'(\\d+)\\s*(мин|минут|минуты|м)'+E,'i'),function(m){ r.dur=+m[2]; });
  if(r.dur){ r.dur=Math.min(Math.max(r.dur,15),12*60); }
  // время
  cut(new RegExp(B+'(?:в\\s*)?(\\d{1,2}):(\\d{2})'+E,'i'),function(m){ var H=+m[2],M=+m[3]; if(H>23||M>59) return false; r.time=pad(H)+':'+pad(M); });
  if(!r.time) cut(new RegExp(B+'в\\s+(\\d{1,2})(?:\\s*(?:ч|час|часа|часов))?'+E,'i'),function(m){ var H=+m[2]; if(H>23) return false; r.time=pad(H)+':00'; });
  // дата
  var now=new Date();
  cut(new RegExp(B+'послезавтра'+E,'i'),function(){ r.date=ymd(addDays(now,2)); r.dateLbl='послезавтра'; });
  if(!r.date) cut(new RegExp(B+'завтра'+E,'i'),function(){ r.date=ymd(addDays(now,1)); r.dateLbl='завтра'; });
  if(!r.date) cut(new RegExp(B+'сегодня'+E,'i'),function(){ r.date=ymd(now); r.dateLbl='сегодня'; });
  if(!r.date) WD_RE.forEach(function(w,i){ if(r.date) return;
    cut(new RegExp(B+'(?:во?\\s+)?(?:'+w[0]+'|'+w[1]+')'+E,'i'),function(){ var diff=(i-wdIdx(now)+7)%7; r.date=ymd(addDays(now,diff)); r.dateLbl=WD_FULL[i]; });
  });
  if(!r.date) cut(new RegExp(B+'(\\d{1,2})\\s+('+MON_GEN.join('|')+')'+E,'i'),function(m){
    var mo=MON_GEN.indexOf(m[3].toLowerCase()), d=new Date(now.getFullYear(),mo,+m[2]); if(ymd(d)<ymd(now)) d.setFullYear(d.getFullYear()+1); r.date=ymd(d); r.dateLbl=d.getDate()+' '+MON_GEN[mo]; });
  if(!r.date) cut(new RegExp(B+'(\\d{1,2})\\.(\\d{1,2})'+E,'i'),function(m){
    var dd=+m[2], mo=+m[3]-1; if(dd<1||dd>31||mo<0||mo>11) return false; var d=new Date(now.getFullYear(),mo,dd); if(ymd(d)<ymd(now)) d.setFullYear(d.getFullYear()+1); r.date=ymd(d); r.dateLbl=d.getDate()+' '+MON_GEN[mo]; });
  // категория словом
  cut(new RegExp(B+'(важно|важное|срочно)'+E,'i'),function(){ r.cat='imp'; });
  if(!r.cat) cut(new RegExp(B+'(блог)'+E,'i'),function(){ r.cat='blog'; });
  if(!r.cat) cut(new RegExp(B+'(домик|дом)'+E,'i'),function(){ r.cat='home'; });
  if(!r.cat) cut(new RegExp(B+'(dw|дв)'+E,'i'),function(){ r.cat='dw'; });
  if(!r.cat) cut(new RegExp(B+'(для\\s+себя)'+E,'i'),function(m){ var low=s.toLowerCase(); if(/время\s+для\s+себя/.test(low)) return false; r.cat='self'; });
  var title=s.replace(/\s+/g,' ').trim();
  // подпункт: «зал» → «Зал», «Для себя», значок
  var low=title.toLowerCase(), best=null;
  for(var c in QUICK) QUICK[c].forEach(function(q){ var n=q[0].toLowerCase(); if(low===n||low.indexOf(n)===0){ if(!best||n.length>best.n.length) best={n:n,q:q,c:c}; } });
  if(best){ if(low===best.n) title=best.q[0]; if(!r.cat) r.cat=best.c; r.icon=best.q[1]; }
  if(title) title=title[0].toUpperCase()+title.slice(1);
  r.title=title;
  r.any=!!(r.date||r.time||r.dur||r.cat);
  return r;
}

/* ---------- итоги недели ---------- */

    +'<div class="wk-ring" style="background:conic-gradient(var(--accent-solid) '+pct+'%, var(--soft) 0)"><span>'+pct+'%</span></div></div>';

/* ---------- отметки изменений и слияние ---------- */
var ARR=['tasks','inbox','wishes','insights','habits'];
function strip(o){ var c={}; for(var k in o) if(k!=='u') c[k]=o[k]; return JSON.stringify(c); }
function takeSnap(d){
  var it={}, hb={};
  ARR.forEach(function(k){ (d[k]||[]).forEach(function(x){ it[x.id]=strip(x); }); });
  for(var dt in (d.habitLog||{})) for(var h in d.habitLog[dt]) if(d.habitLog[dt][h]) hb[dt+'|'+h]=1;
  return {it:it,hb:hb};
}
var SNAP=takeSnap(D);
// помечаем, что и когда изменилось, — чтобы при слиянии побеждала более свежая правка
function stamp(){
  var now=Date.now(), cur=takeSnap(D); D.deleted=D.deleted||{}; D.hlu=D.hlu||{};
  ARR.forEach(function(k){ (D[k]||[]).forEach(function(x){ if(cur.it[x.id]!==SNAP.it[x.id]) x.u=now; }); });
  for(var id in SNAP.it) if(!(id in cur.it)) D.deleted[id]=now;
  var keys={}; for(var a in SNAP.hb) keys[a]=1; for(var b in cur.hb) keys[b]=1;
  for(var key in keys) if(!!SNAP.hb[key]!==!!cur.hb[key]) D.hlu[key]=now;
  SNAP=cur;
}
function mergeData(L,Rm){
  var out=JSON.parse(JSON.stringify(L)), del={};
  [L.deleted||{},Rm.deleted||{}].forEach(function(m){ for(var id in m) del[id]=Math.max(del[id]||0,m[id]); });
  ARR.forEach(function(k){
    var arr=out[k]||[], idx={}; arr.forEach(function(x,i){ idx[x.id]=i; });
    var add=[];
    (Rm[k]||[]).forEach(function(r){
      if(r.id in idx){ if((r.u||0)>(arr[idx[r.id]].u||0)) arr[idx[r.id]]=JSON.parse(JSON.stringify(r)); }
      else add.push(JSON.parse(JSON.stringify(r)));
    });
    arr = (k==='inbox'||k==='insights') ? add.concat(arr) : arr.concat(add);
    out[k]=arr.filter(function(x){ return !(del[x.id] && del[x.id]>=(x.u||0)); });
  });
  out.deleted=del;
  var lu=L.hlu||{}, ru=Rm.hlu||{}, hl={}, hlu={}, keys={};
  [L.habitLog||{},Rm.habitLog||{}].forEach(function(g){ for(var dt in g) for(var h in g[dt]) keys[dt+'|'+h]=1; });
  for(var a in lu) keys[a]=1; for(var b in ru) keys[b]=1;
  function has(g,key){ var p=key.split('|'); return !!(g&&g[p[0]]&&g[p[0]][p[1]]); }
  for(var key in keys){
    var l=lu[key]||0, r=ru[key]||0, v;
    if(r>l) v=has(Rm.habitLog,key); else if(l>r) v=has(L.habitLog,key); else v=has(L.habitLog,key)||has(Rm.habitLog,key);
    if(v){ var pp=key.split('|'); hl[pp[0]]=hl[pp[0]]||{}; hl[pp[0]][pp[1]]=true; }
    if(l||r) hlu[key]=Math.max(l,r);
  }
  out.habitLog=hl; out.hlu=hlu;
  // одинаковые привычки с разных устройств склеиваем в одну (всегда выбираем один и тот же id)
  var byName={}, remap={};
  out.habits.forEach(function(h){ var k=String(h.title).trim().toLowerCase(); (byName[k]=byName[k]||[]).push(h); });
  for(var nm in byName){ var g=byName[nm]; if(g.length<2) continue; g.sort(function(a,b){return a.id<b.id?-1:1;}); for(var i=1;i<g.length;i++) remap[g[i].id]=g[0].id; }
  if(Object.keys(remap).length){
    out.habits=out.habits.filter(function(h){ return !remap[h.id]; });
    for(var dt in out.habitLog) for(var hid in out.habitLog[dt]) if(remap[hid]){ out.habitLog[dt][remap[hid]]=true; delete out.habitLog[dt][hid]; }
    for(var kk in out.hlu){ var pr=kk.split('|'); if(remap[pr[1]]){ var nk=pr[0]+'|'+remap[pr[1]]; out.hlu[nk]=Math.max(out.hlu[nk]||0,out.hlu[kk]); delete out.hlu[kk]; } }
  }
  var st={}; [Rm.steps||{},L.steps||{}].forEach(function(m){ for(var k in m) st[k]=Math.max(st[k]||0,m[k]); }); out.steps=st;
  out.insDraft=L.insDraft||'';
  return out;
}
function payload(d){ var c={}; for(var k in d) if(k!=='insDraft') c[k]=d[k]; return JSON.stringify(c); }

/* ---------- синхронизация через GitHub (закрытый gist) ---------- */
var Sync=(function(){
  var SKEY='tracker.sync', FILE='tracker.json', API='https://api.github.com';
  var cfg={}; try{ cfg=JSON.parse(localStorage.getItem(SKEY)||'{}'); }catch(e){}
  var timer=null, busy=false, again=false, lastErr='', poll=null;
  function persist(){ try{ localStorage.setItem(SKEY,JSON.stringify(cfg)); }catch(e){} }
  function on(){ return !!(cfg.token&&cfg.gist); }
  function dot(state){ var d=$('sdot'); if(!d) return; d.hidden=!state; d.className='sdot'+(state==='busy'?' busy':''); d.title=state==='err'?'Синхронизация не удалась':''; }
  function api(path,opt){
    opt=opt||{}; opt.headers={'Authorization':'Bearer '+cfg.token,'Accept':'application/vnd.github+json','Content-Type':'application/json'}; opt.cache='no-store';
    return fetch(API+path,opt).then(function(r){
      if(r.status===401) throw new Error('auth');
      if(r.status===403||r.status===404) throw new Error('scope');
      if(!r.ok) throw new Error('http '+r.status);
      return r.json();
    });
  }
  function readGist(g){
    var f=g.files&&g.files[FILE]; if(!f) return Promise.resolve(null);
    if(f.truncated && f.raw_url) return fetch(f.raw_url,{cache:'no-store'}).then(function(r){return r.text();}).then(function(t){ return t?JSON.parse(t):null; });
    return Promise.resolve(f.content?JSON.parse(f.content):null);
  }
  function run(manual){
    if(!on()) return Promise.resolve();
    if(busy){ again=true; return Promise.resolve(); }
    if(!navigator.onLine){ dot('err'); lastErr='нет интернета'; return Promise.resolve(); }
    busy=true; dot('busy');
    return api('/gists/'+cfg.gist).then(function(g){
      var sf=g.files&&g.files['steps.json'];
      if(sf&&sf.content){ var m=String(sf.content).match(/(\d{4}-\d{2}-\d{2})\D+([\d\s\u00A0.,]+)/);
        if(m){ var v=m[2].replace(/[\s\u00A0]/g,''); v=/[.,]\d{3}$/.test(v)?v.replace(/[.,]/g,''):v.replace(',','.'); var n=Math.round(parseFloat(v));
          if(n>=0 && applySteps(m[1],n)){ stamp(); store(); renderHabits(); renderBattery(); } } }
      return readGist(g);
    }).then(function(remote){
      var before=payload(D);
      var merged = remote ? mergeData(D,remote) : D;
      if(payload(merged)!==before){
        D=merged; SNAP=takeSnap(D); store();
        if(!UI.modal||UI.modal.kind==='settings'){ var sc=$('cal-scroll'), top=sc?sc.scrollTop:0; render(); if($('cal-scroll')) $('cal-scroll').scrollTop=top; }
      }
      if(!remote || payload(D)!==payload(remote)){
        var body={files:{}}; body.files[FILE]={content:payload(D)};
        return api('/gists/'+cfg.gist,{method:'PATCH',body:JSON.stringify(body)});
      }
    }).then(function(){
      lastErr=''; cfg.last=Date.now(); persist(); dot(null);
      if(manual) toast('Синхронизировано');
      if(UI.modal&&UI.modal.kind==='settings') drawSettings();
    }).catch(function(e){
      lastErr = e.message==='auth' ? 'ключ не подходит или истёк' : (navigator.onLine?'GitHub не ответил':'нет интернета');
      dot('err'); if(manual||e.message==='auth') toast('Синхронизация: '+lastErr);
    }).then(function(){ busy=false; if(again){ again=false; schedule(); } });
  }
  function schedule(){ if(!on()) return; clearTimeout(timer); timer=setTimeout(function(){ run(false); },1500); }
  function connect(){
    var inp=$('sync-token'), tok=(inp&&inp.value||'').replace(/[^A-Za-z0-9_]/g,'');
    if(!tok){ toast('Вставьте ключ из GitHub'); if(inp) inp.focus(); return; }
    if(tok.indexOf('github_pat_')===0){ toast('Это ключ нового типа. Нужен ключ «classic» — создайте его по ссылке «Создать ключ на GitHub»'); return; }
    if(tok.indexOf('ghp_')!==0){ toast('Ключ должен начинаться с ghp_. Скопируйте его целиком'); return; }
    cfg.token=tok; dot('busy');
    // ищем уже созданную заметку трекера, иначе создаём новую
    api('/gists?per_page=100').then(function(list){
      var g=(list||[]).filter(function(x){ return x.description==='tracker-sync' && x.files && x.files[FILE]; })[0];
      if(g) return g.id;
      var body={description:'tracker-sync',public:false,files:{}}; body.files[FILE]={content:payload(D)};
      return api('/gists',{method:'POST',body:JSON.stringify(body)}).then(function(n){ return n.id; });
    }).then(function(id){
      cfg.gist=id; persist(); startPoll();
      return run(false).then(function(){ toast('Синхронизация включена'); if(UI.modal&&UI.modal.kind==='settings') drawSettings(); });
    }).catch(function(e){
      cfg={}; persist(); dot(null);
      toast(e.message==='auth'?'GitHub не узнал ключ: он скопирован не полностью или уже удалён. Создайте новый и вставьте целиком':(e.message==='scope'?'У ключа нет доступа к gist. При создании отметьте галочку gist':'Не удалось подключиться. Проверьте интернет'));
    });
  }
  function off(){ cfg={}; persist(); clearInterval(poll); dot(null); }
  function startPoll(){ clearInterval(poll); poll=setInterval(function(){ if(!document.hidden) run(false); },60000); }
  function timeStr(ts){ var d=new Date(ts); return (todayStr()===ymd(d)?'сегодня':d.getDate()+' '+MON_GEN[d.getMonth()])+' в '+pad(d.getHours())+':'+pad(d.getMinutes()); }
  function settingsHtml(){
    var h='<div class="col"><span class="lbl">Синхронизация</span>';
    if(on()){
      h+='<div class="sync-ok">Задачи, привычки, желания и инсайты синхронизируются между всеми устройствами, где подключён этот ключ.<br>'
        +(lastErr?'Сейчас не получилось: '+esc(lastErr)+'.':(cfg.last?'Последняя синхронизация: '+timeStr(cfg.last)+'.':''))+'</div>'
        +'<div class="wrapr" style="align-items:center"><button class="pill soft" data-a="sync-now">Синхронизировать сейчас</button><button class="link" data-a="sync-off" style="margin-left:8px">Отключить</button></div>';
    } else {
      h+='<div class="sync-ok">Чтобы задачи были одинаковыми на компьютере и телефоне, подключите ключ GitHub. Один и тот же ключ вставляется на каждом устройстве.<br>'
        +'<a href="https://github.com/settings/tokens/new?scopes=gist&description=%D0%A2%D1%80%D0%B5%D0%BA%D0%B5%D1%80" target="_blank" rel="noopener" style="color:var(--ink);text-decoration:underline;text-underline-offset:3px">Создать ключ на GitHub</a></div>'
        +'<form onsubmit="return false" style="display:flex;gap:8px"><input class="field" id="sync-token" type="password" placeholder="Вставьте ключ ghp_…" autocomplete="off" spellcheck="false" aria-label="Ключ GitHub"><button class="dark" type="button" data-a="sync-connect" style="flex:none;height:48px">Подключить</button></form>';
    }
    return h+'</div>';
  }
  function init(){
    if(on()){ run(false); startPoll(); }
    document.addEventListener('visibilitychange',function(){ if(!document.hidden) run(false); });
    window.addEventListener('online',function(){ run(false); });
  }
  return {on:on,run:run,schedule:schedule,connect:connect,off:off,settingsHtml:settingsHtml,init:init,gistId:function(){ return cfg.gist||''; }};
})();

/* ---------- запуск ---------- */
render();
Sync.init();
(MQ.addEventListener?MQ.addEventListener('change',renderCalendar):MQ.addListener(renderCalendar));
// обновляем «сегодня» и линию времени раз в минуту, а при смене даты — всё
var lastDay=todayStr();
setInterval(function(){ if(todayStr()!==lastDay){ lastDay=todayStr(); render(); } else if(!UI.drag&&UI.view==='week'){ var sc=$('cal-scroll'), top=sc?sc.scrollTop:0; renderCalendar(); if($('cal-scroll')) $('cal-scroll').scrollTop=top; } },60000);
document.addEventListener('visibilitychange',function(){ if(!document.hidden && todayStr()!==lastDay){ lastDay=todayStr(); render(); } });
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){ navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(function(r){ r.update(); document.addEventListener('visibilitychange',function(){ if(!document.hidden) r.update(); }); }).catch(function(){});
  // когда подтянулась новая версия — тихо перезагружаемся один раз
  var reloaded=false; navigator.serviceWorker.addEventListener('controllerchange',function(){ if(reloaded) return; reloaded=true; if(!UI.modal) location.reload(); }); }
})();
</script>
